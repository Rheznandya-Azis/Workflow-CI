name: Retrain Credit Eligibility Model

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "MLProject/modelling.py"
      - "MLProject/MLproject"
      - "MLProject/conda.yaml"
      - "MLProject/requirements.txt"
      - "MLProject/credit-eligibility_preprocessing.xlsx"
      - ".github/workflows/retrain.yml"

permissions:
  contents: read

jobs:
  retrain-model:
    name: Train model with MLflow Project
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/MLProject/mlflow.db
      MLFLOW_EXPERIMENT_NAME: credit_eligibility_classification
      MLFLOW_LOGGING_LEVEL: DEBUG
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "MLProject/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r MLProject/requirements.txt

      - name: Show installed versions
        run: |
          python --version
          mlflow --version
          python -c "import sklearn, pandas, mlflow; print('scikit-learn:', sklearn.__version__); print('pandas:', pandas.__version__); print('mlflow:', mlflow.__version__)"

      - name: Validate Python syntax
        run: |
          python -m py_compile MLProject/modelling.py

      - name: Validate required files
        run: |
          test -f MLProject/modelling.py
          test -f MLProject/MLproject
          test -f MLProject/conda.yaml
          test -f MLProject/requirements.txt
          test -f MLProject/credit-eligibility_preprocessing.xlsx

      - name: Prepare output directories
        run: |
          mkdir -p MLProject/outputs
          mkdir -p "${RUNNER_TEMP}/mlflow-project-storage"

      - name: Run retraining through MLflow Project
        shell: bash
        run: |
          set -o pipefail
      
          mlflow run ./MLProject \
            --entry-point main \
            --env-manager local \
            --storage-dir "${RUNNER_TEMP}/mlflow-project-storage" \
            --experiment-name "${MLFLOW_EXPERIMENT_NAME}" \
            --run-name "github-actions-${GITHUB_RUN_NUMBER}" \
            -P data_path="${GITHUB_WORKSPACE}/MLProject/credit-eligibility_preprocessing.xlsx" \
            -P test_size=0.2 \
            -P output_dir="outputs" \
            2>&1 | tee MLProject/outputs/mlflow_run.log
    
      - name: Get MLflow run ID
        shell: bash
        run: |
          python - <<'PY'
          import os
          import mlflow
          from mlflow import MlflowClient
      
          mlflow.set_tracking_uri(
              os.environ["MLFLOW_TRACKING_URI"]
          )
      
          client = MlflowClient()
      
          experiment = client.get_experiment_by_name(
              os.environ["MLFLOW_EXPERIMENT_NAME"]
          )
      
          if experiment is None:
              raise RuntimeError(
                  "MLflow experiment tidak ditemukan."
              )
      
          expected_name = (
              f"github-actions-"
              f"{os.environ['GITHUB_RUN_NUMBER']}"
          )
      
          runs = client.search_runs(
              experiment_ids=[experiment.experiment_id],
              order_by=["attributes.start_time DESC"],
              max_results=100,
          )
      
          run = next(
              (
                  item
                  for item in runs
                  if item.data.tags.get("mlflow.runName")
                  == expected_name
              ),
              None,
          )
      
          if run is None:
              raise RuntimeError(
                  f"Run tidak ditemukan: {expected_name}"
              )
      
          run_id = run.info.run_id
      
          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8",
          ) as file:
              file.write(
                  f"MLFLOW_RUN_ID={run_id}\n"
              )
      
          print(f"MLflow run ID: {run_id}")
          PY
        
      - name: Register Model to MLflow Registry
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import os
          import mlflow
      
          mlflow.set_tracking_uri(
              os.environ["MLFLOW_TRACKING_URI"]
          )
          mlflow.set_registry_uri(
              os.environ["MLFLOW_REGISTRY_URI"]
          )
      
          run_id = os.environ["MLFLOW_RUN_ID"].strip()
      
          if not run_id:
              raise RuntimeError(
                  "MLFLOW_RUN_ID kosong."
              )
      
          model_uri = f"runs:/{run_id}/model"
      
          result = mlflow.register_model(
              model_uri=model_uri,
              name="Model-Eligibility-Kredit",
          )

      - name: Display training outputs
        if: success()
        run: |
          echo "Generated files:"
          find MLProject/outputs -maxdepth 2 -type f -print

          echo ""
          echo "Metrics:"
          cat MLProject/outputs/metrics.json

      - name: Upload model and MLflow results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credit-eligibility-model-run-${{ github.run_number }}
          path: |
            MLProject/outputs/
            MLProject/mlflow.db
            MLProject/mlruns/
            mlruns/
          if-no-files-found: warn
          retention-days: 30
