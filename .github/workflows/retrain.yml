name: Retrain Credit Eligibility Model

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "MLProject/modelling.py"
      - "MLProject/MLproject"
      - "MLProject/conda.yaml"
      - "MLProject/requirements.txt"
      - "MLProject/credit-eligibility_preprocessing.xlsx"
      - ".github/workflows/retrain.yml"

permissions:
  contents: read

jobs:
  retrain-model:
    name: Train model with MLflow Project
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/MLProject/mlflow.db
      MLFLOW_EXPERIMENT_NAME: credit_eligibility_classification
      MLFLOW_LOGGING_LEVEL: DEBUG
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "MLProject/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r MLProject/requirements.txt

      - name: Show installed versions
        run: |
          python --version
          mlflow --version
          python -c "import sklearn, pandas, mlflow; print('scikit-learn:', sklearn.__version__); print('pandas:', pandas.__version__); print('mlflow:', mlflow.__version__)"

      - name: Validate Python syntax
        run: |
          python -m py_compile MLProject/modelling.py

      - name: Validate required files
        run: |
          test -f MLProject/modelling.py
          test -f MLProject/MLproject
          test -f MLProject/conda.yaml
          test -f MLProject/requirements.txt
          test -f MLProject/credit-eligibility_preprocessing.xlsx

      - name: Prepare output directories
        run: |
          mkdir -p MLProject/outputs
          mkdir -p "${RUNNER_TEMP}/mlflow-project-storage"

      - name: Run retraining through MLflow Project
        shell: bash
        run: |
          set -o pipefail

          mlflow run ./MLProject \
            --entry-point main \
            --env-manager local \
            --storage-dir "${RUNNER_TEMP}/mlflow-project-storage" \
            --experiment-name "${MLFLOW_EXPERIMENT_NAME}" \
            --run-name "github-actions-${GITHUB_RUN_NUMBER}" \
            -P data_path="${GITHUB_WORKSPACE}/MLProject/credit-eligibility_preprocessing.xlsx" \
            -P test_size=0.2 \
            -P output_dir="outputs" \
            2>&1 | tee MLProject/outputs/mlflow_run.log

      - name: Get latest mlflow run_id
        if: success()
        run: |
          run_id=$(ls -td mlruns/0/*/ | head -n 1 | cut -d'/' -f3)
          echo "RUN_ID=$run_id" >> $GITHUB_ENV

      - name: Register Model to MLflow Registry
        if: success()
        run: |
          # Menggunakan modul Python inline untuk memicu fungsi registrasi resmi MLflow API
          python -c "import mlflow; mlflow.register_model('runs:/${{ env.RUN_ID }}/outputs', 'Model-Eligibility-Kredit')"

      - name: Display training outputs
        if: success()
        run: |
          echo "Generated files:"
          find MLProject/outputs -maxdepth 2 -type f -print

          echo ""
          echo "Metrics:"
          cat MLProject/outputs/metrics.json

      - name: Upload model and MLflow results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credit-eligibility-model-run-${{ github.run_number }}
          path: |
            MLProject/outputs/
            MLProject/mlflow.db
            MLProject/mlruns/
            mlruns/
          if-no-files-found: warn
          retention-days: 30
